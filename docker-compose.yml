services:
  db:
    image: pgvector/pgvector:pg17
    container_name: pea_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pea_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  pea_pgdata:
